name: Verifica e faz deploy

# Builda no runner do GitHub (memória/CPU de sobra), nunca no servidor de
# produção — a VPS da Oracle (Ampere ARM, 1 OCPU) é pequena e compartilhada
# com outros projetos; um build local (`npm ci` + `next build`) já derrubou a
# EC2 antiga inteira uma vez (ver docs/07-infraestrutura-deploy.md).
#
# `verify` é o portão de qualidade: typecheck, lint e testes. Em pull
# request roda só ele; o deploy (push na main) só acontece se passar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gera os tipos globais de rota (LayoutProps, RouteContext) que o
      # `tsc` sozinho não conhece — normalmente criados por dev/build.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npx eslint src

      - run: npm test

  deploy:
    name: Deploy na Oracle (VPS ARM)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner ARM nativo (grátis em repo público): a imagem sai pronta para a VPS Ampere,
    # sem emulação e sem build no servidor de produção.
    # A chave de DEPLOY_SSH_KEY só executa /usr/local/bin/deploy-lifeos na VPS (restrict + command=);
    # os segredos do app ficam só no .env de /opt/stacks na VPS.
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem ARM
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: ghcr.io/vinnisntos/app-vinnicius:latest
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Envia para a VPS e sobe
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          gzip -c /tmp/image.tar | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@146.235.38.173

      - name: Verificar site
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 3 https://lifeos.vinnisantos.com.br/login
