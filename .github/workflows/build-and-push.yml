name: Build e publica imagem Docker

# Builda no runner do GitHub (memória/CPU de sobra), nunca no servidor de
# produção — a instância EC2 é pequena e compartilhada com outros projetos;
# um build local (`npm ci` + `next build`) já derrubou a máquina inteira uma
# vez (ver docs/07-infraestrutura-deploy.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
